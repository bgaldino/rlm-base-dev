# Build and publish the rlm-base build-environment image to GitHub Container
# Registry (GHCR), so users can download it instead of building locally.
#
# Triggers (never on ordinary pushes/PRs):
#   • Manually:  Actions → "Publish build-environment image" → Run workflow
#   • On tag:    push a tag matching `image-v*` (e.g. `image-v262.0`)
#   • Weekly:    scheduled rebuild (cron below) — runs automatically and also
#                refreshes the `:latest` tag
#
# After a run, the image is at:
#   ghcr.io/<owner>/rlm-base:<tag>     e.g. ghcr.io/bgaldino/rlm-base:latest
# Make the package public (Packages → rlm-base → Settings) for unauthenticated
# `docker pull`, or have users `docker login ghcr.io` first.
name: Publish build-environment image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 262)"
        required: true
        default: "latest"
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
  push:
    tags:
      - "image-v*"
  schedule:
    # Weekly rebuild — Mondays 07:00 UTC — so the published image keeps current
    # with base-image security patches, the latest sf CLI / SFDMU, and main's
    # repo snapshot. Scheduled runs always build from the default branch (main).
    # Adjust the cron (UTC, 5-field) to change cadence. Note: GitHub disables
    # scheduled workflows after 60 days of repo inactivity.
    - cron: "0 7 * * 1"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

# No default token permissions; each job grants only what it uses.
permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set image coordinates
        id: meta
        # Dispatch inputs arrive through env, never interpolated into the script, and are
        # validated before they reach $GITHUB_OUTPUT (a newline there would add an output).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # lowercase for GHCR
          echo "image=ghcr.io/${owner}/rlm-base" >> "$GITHUB_OUTPUT"
          case "$EVENT_NAME" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              platforms="$INPUT_PLATFORMS" ;;
            schedule)
              # Weekly run: date-stamped tag for history, plus :latest (added below).
              tag="$(date -u +%Y%m%d)"
              platforms="linux/amd64,linux/arm64" ;;
            *)  # tag push (image-v*)
              tag="${GITHUB_REF_NAME#image-v}"
              platforms="linux/amd64,linux/arm64" ;;
          esac
          # Validated for every event (a pushed tag like `image-v` would give an empty one) before
          # anything reaches $GITHUB_OUTPUT; the rejected value isn't echoed, so it can't forge a
          # workflow command.
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::invalid image tag"; exit 1; }
          [[ "$platforms" =~ ^[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?(,[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?)*$ ]] \
            || { echo "::error::invalid platforms"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "### Published \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "RLM_IMAGE=${IMAGE}:${TAG} ./docker/rlm pull" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
