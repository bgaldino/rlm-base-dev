bundles:
  - parent_sku: SFDC-MAX-SUITE
    component_group: Max Suite Components
    children:
      - { sku: SFDC-SALES-MAX, required: true, min: 1, max: 1 }
      - { sku: SFDC-SLACK-BIZPLUS, required: false, min: 0, max: 500 }
      - { sku: SFDC-TABLEAU-NEXT, required: false, min: 0, max: 500 }

attributes:
  picklists:
    - name: SFDC Service Plan
      values:
        - { code: SFDC-SP-STD, value: Standard }
        - { code: SFDC-SP-PREM, value: Premier }
        - { code: SFDC-SP-SIG, value: Signature }
  definitions:
    - developer_name: SFDC_Service_Plan
      code: SFDC-SVC-PLAN
      label: Success Plan
      picklist: SFDC Service Plan
      is_price_impacting: true
      applies_to_skus: [SFDC-SALES-CORE]

pricing_rules:
  # Premier Success is published at 30% of net license fees. Signature is
  # quote-only; 60% is a demo estimate.
  - rule_name: SFDC-CORE-PREMIER
    sku: SFDC-SALES-CORE
    attribute_code: SFDC-SVC-PLAN
    operator: equals
    string_value: Premier
    adjustment_type: Percentage
    adjustment_value: 30
    psm_name: Term Annual
  - rule_name: SFDC-CORE-SIGNATURE
    sku: SFDC-SALES-CORE
    attribute_code: SFDC-SVC-PLAN
    operator: equals
    string_value: Signature
    adjustment_type: Percentage
    adjustment_value: 60
    psm_name: Term Annual

uom:
  # CRD is owned by the Snowflake class (SNFCRED) and EVENT by DEVICE_EVENTS.
  # A unit belongs to exactly one class, so Salesforce metering gets its own.
  classes:
    - { code: SFDCCRED, name: Salesforce Flex Credits, type: Usage,
        base_unit: FLEXCRD, default_unit: FLEXCRD }
    - { code: SFDCCONV, name: Agentforce Conversations, type: Usage,
        base_unit: AFCONV, default_unit: AFCONV }
  units:
    - { unit_code: EACH, name: Each, class_code: "" }   # pre-exists in org
    - { unit_code: FLEXCRD, name: Flex Credit, class_code: SFDCCRED }
    - { unit_code: AFCONV, name: Agentforce Conversation, class_code: SFDCCONV }

usage:
  resources:
    - code: SFDC-UR-FLEX
      name: Agentforce Flex Credits
      category: Usage
      uom_class_name: Salesforce Flex Credits
      default_uom_name: Flex Credit
      definition_sku: SFDC-BLNG-FLEX
      billing_policy_code: monthlytotal
    - code: SFDC-UR-CONV
      name: Agentforce Conversations
      category: Usage
      uom_class_name: Agentforce Conversations
      default_uom_name: Agentforce Conversation
      definition_sku: SFDC-BLNG-CONV
      billing_policy_code: monthlytotal
  # These must already exist in the org — SFDMU silently fails to create them.
  grant_policies:
    renewal_code: SF-DEMO-USG-RENEW
    rollover_code: SF-DEMO-USG-ROLL
    overage_name: Default Usage Overage Policy
  rate_cards:
    # rate_uom names the CONSUMPTION unit the rate is quoted per. On RateCardEntry
    # it lands as DefaultUnitOfMeasure; RateUnitOfMeasure is the money unit (USD).
    - name: CD-DEMO Base Rate Card
      type: Base
      entries:
        # $500 per 100k credits = $0.005/credit
        - { sku: SFDC-USG-FLEX, usage_resource_code: SFDC-UR-FLEX,
            rate: 0.005, rate_uom: FLEXCRD, psm_name: Term Monthly }
        - { sku: SFDC-USG-CONV, usage_resource_code: SFDC-UR-CONV,
            rate: 2.00, rate_uom: AFCONV, psm_name: Term Monthly }
    - name: CD-DEMO Tier Rate Card
      type: Tier
      entries:
        - sku: SFDC-USG-FLEX
          usage_resource_code: SFDC-UR-FLEX
          rate: ""
          rate_uom: FLEXCRD
          psm_name: Term Monthly
          tiers:
            - { lower: 0, upper: 1000000, adjustment_type: Override, adjustment_value: 0.005 }
            - { lower: 1000000, upper: 5000000, adjustment_type: Override, adjustment_value: 0.004 }
            - { lower: 5000000, upper: null, adjustment_type: Override, adjustment_value: 0.003 }

dro:
  scenarios:
    - sku: SFDC-SALES-CORE
      decomposition_scope: OrderLineItem
      routes: [QB-DRO-BILL]
      step_group: Finance
      actions: [Add, Amend, Renew, Cancel]
    - sku: SFDC-SALES-MAX
      decomposition_scope: OrderLineItem
      routes: [QB-DRO-BILL]
      step_group: Provisioning & Activation
      actions: [Add, Amend, Renew, Cancel]
    - sku: SFDC-RC-GROWTH
      decomposition_scope: OrderLineItem
      routes: [QB-DRO-BILL]
      step_group: Provisioning & Activation
      actions: [Add, Amend, Renew, Cancel]
    - sku: SFDC-USG-FLEX
      decomposition_scope: OrderLineItem
      routes: [QB-DRO-BILL]
      step_group: Usage Provisioning & Activation
      actions: [Add, Amend, Cancel]
    - sku: SFDC-SVC-IMPL
      decomposition_scope: OrderLineItem
      routes: [QB-DRO-PROJ]
      step_group: Services
      actions: [Add, Cancel]

experience:
  # salesforce.com and Wikimedia both 403'd, so the Experience builder generated a
  # branded wordmark placeholder instead. Overwrite this file with a real logo and
  # re-run the tile generator plus prepare_customer_branding.py to swap it in.
  logo_source: datasets/sfdmu/customer-template/en-US/customer-template-product-images/tools/assets/sfdc-logo.png
  brand_color: "#00B4FF"
  bg_color: "#FFFFFF"
  static_resource_prefix: sfdc
