# SKU Contract — Salesforce demo catalog
#
# Written by the conductor after the vision gate. Builders READ this file; none edit it.
# Schema: docs/references/customer-demo-sku-contract.md
#
# Prefix note: SFDC, not SF. The Snowflake demo already owns SF-USG-*, SF-BLNG-*,
# SF-UR-*, and SF-DEMO-USG-* in this org.

contract_version: 1

customer:
  name: Salesforce
  prefix: SFDC
  website: https://www.salesforce.com

flags:
  customer_demo_usage: true
  customer_demo_dro: true
  customer_demo_branding: true

org:
  alias: rc-apr8-customer-template
  context_file: datasets/sfdmu/customer-template/en-US/org-context.json

catalog:
  name: Salesforce Demo Catalog
  code: CAT-SFDC

categories:
  - code: PC-SFDC-CRM
    name: CRM Applications
  - code: PC-SFDC-AI
    name: AI & Data
  - code: PC-SFDC-ADDON
    name: Add-Ons
  - code: PC-SFDC-SVC
    name: Success & Services

billing:
  legal_entity: Salesforce, Inc.
  # Prefixed: the org already has a generic "Net 30" and PaymentTerm upserts on Name.
  payment_terms:
    - { name: SFDC Net 30, days: 30 }
  policies:
    # Licenses invoice annually in advance; metered Agentforce usage bills
    # monthly in arrears, matching Flex PayGo.
    - name: SFDC Annual Advance
      payment_term: SFDC Net 30
      treatment: Salesforce Annual Subscription
      frequency: Yearly
    - name: SFDC Monthly Arrears
      payment_term: SFDC Net 30
      treatment: Salesforce Monthly Usage
      frequency: Monthly

# Prices are annual totals (published monthly list x 12) on Term Annual.
