    name: Salesforce Max Suite
    category_code: PC-SFDC-CRM
    type: Bundle
    configure_during_sale: Allowed
    psm_name: Term Annual
    psm_selling_model_type: TermDefined
    unit_price: 6600
    currency: USD
    image_required: true
    billing_required: true
    billing_policy_name: SFDC Annual Advance
