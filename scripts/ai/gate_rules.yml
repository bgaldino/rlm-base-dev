# Pre-push gate rules — Tiers B, C and D (todo 080 Deliverable 1).
#
# SCOPE BOUNDARY. This file is repo POLICY: the AGENTS.md DO NOT list (Tier B),
# the .cursor/rules/*.mdc rules (Tier C), and the doc-consistency change-surface
# map (Tier D). It deliberately does NOT hold defect classes observed on PR
# review rounds — those live in `defect_classes.yml` (Tier E) and are scanned by
# `defect_scan.py`. Keeping them apart matters: Tier E sweeps the whole repo
# surface because round-9 misses were in untouched files, whereas most rules
# here are about what THIS change did.
#
# SCHEMA
#   id            required, kebab-case, unique
#   tier          B | C | D
#   source        where the rule is written down, so a disagreement is settleable
#   severity      blocker | important | minor
#   detection     mechanical | review-prompt
#                 mechanical   -> evaluated here; any match fails the gate
#                 review-prompt-> NOT greppable without false positives; printed
#                                 as a required manual confirmation. Never
#                                 silently passes.
#   scope         changed-path   FAIL if a changed file matches `paths`
#                 added-path     FAIL if a NEWLY ADDED file matches `paths`
#                 changed-content FAIL if a changed file under `paths` matches a
#                                 pattern (whole file, not just the added hunk —
#                                 a rule that only reads the diff misses the rest
#                                 of the class in the same file)
#                 repo-content   same, but over every matching file in the repo
#                 exact-value    file under `paths` must contain `require`
#                 paired-change  if anything under `when_changed` changed, then
#                                 something under `require_changed` must have too
#                 branch         evaluated against the current branch name
#   paths / exclude_paths   repo-root-relative globs
#   patterns      list of Python regexes (single-quoted in YAML so backslashes
#                 stay literal)
#   ignore_comment_lines  skip //, #, *, <!-- lines — for rules about code, not prose
#   allow_list    known-good matches; every entry needs a `reason`
#   remediation   what to actually do about it
#
# A rule whose `detection` is mechanical but which defines no way to evaluate
# itself is reported SKIPPED, and a skipped rule fails the run. A check that did
# not execute is not a pass.

# Tier D is KNOWINGLY PARTIAL. The doc-consistency change-surface map has 18
# rows; the rules below enforce 12 (10 mechanically, 2 as blocking prompts —
# see covered_as_prompt). Declared here, and printed by
# pre_push_audit, because a tier that silently covers a fraction of its stated
# scope is the exact failure this gate exists to stop — and it already happened
# once: `scripts/ai/*.py -> AGENTS.md` was an unimplemented row, so the gate
# stayed green while its own three new scripts went undocumented.
#
# Uncovered rows, grouped by what they'd cost. Tracked in todo 080.
tier_d_coverage:
  map: ".cursor/skills/doc-consistency/SKILL.md — change-surface map"
  total_rows: 18
  covered_rows: 12
  # Two rows are enforced as blocking REVIEW PROMPTS rather than mechanically,
  # and that is a deliberate call, not a shortcut. Both need diff-level content
  # analysis: a feature flag is a `name: true|false` line that exists in every
  # version of cumulusci.yml, so a whole-file rule cannot tell a CHANGE from mere
  # presence; and the `tasks/*.py` row is scoped to a task's class/options/
  # description, not its internals, so a path pair would fire on every refactor.
  # A rule that fires on everything gets --ack'd without reading, which turns a
  # control into a formality. They still block until acknowledged.
  covered_as_prompt:
    - "tasks/*.py -> cumulusci.yml description, README Custom Tasks table"
    - "feature flag add/rename/default -> README flag tables, AGENTS.md, feature-flags.md"
  uncovered:
    # Conditional — needs a content probe, not just a path pair.
    - "orgs/*.json -> README Quick Start, only if it names specific configs"
    - "scripts/apex/*.apex -> troubleshooting/SKILL.md, only if it references the script"
    - "new scripts/apex/*.apex -> troubleshooting/SKILL.md + apex-scripts.mdc"
    # Real work, deliberately deferred — dataset-wide reasoning, not a path pair.
    - "product/SKU added -> EVERY plan CSV carrying that SKU, and each of their READMEs"
    - "unpackaged/**/classes/*.cls behaviour change -> revenue-cloud-permissions.md
       when the class is permission-gated, especially as its DESTRUCTIVE scope grows"
    # Named explicitly in the todo pack as a Tier D trap: the permissions doc is
    # hand-maintained, and a prose "(N)" count went stale while the name lists
    # beside it stayed correct. Counts in prose are machine-checked nowhere.
    - "docs/references/revenue-cloud-permissions.md -> parse its (N) counts against
       the cumulusci.yml anchors they describe"

rules:
  # ─────────────────────────── Tier B — AGENTS.md DO NOT ───────────────────────
  - id: post-ux-edited-directly
    tier: B
    source: "AGENTS.md DO NOT #1"
    severity: blocker
    detection: mechanical
    scope: changed-path
    paths: ["unpackaged/post_ux/**"]
    remediation: >
      unpackaged/post_ux/ is auto-generated. Edit templates/ instead and re-run
      `cci task run assemble_and_deploy_ux`, or use the UX drift flows. If this
      change legitimately came from the assembler, it should have arrived with
      the assembler's other output — check nothing was hand-edited afterwards.

  - id: force-app-profile-non-class-access
    tier: B
    source: "AGENTS.md DO NOT #2 / PR review focus area 7"
    severity: blocker
    detection: mechanical
    scope: changed-content
    paths: ["force-app/**/profiles/*.profile-meta.xml"]
    patterns:
      - '<layoutAssignments>'
      - '<applicationVisibilities>'
    remediation: >
      force-app profiles stay classAccesses-only. Move layoutAssignment and
      applicationVisibilities entries to templates/profiles/ so the assembler
      owns them.

  - id: force-app-object-action-overrides
    tier: B
    source: "AGENTS.md DO NOT #3"
    severity: blocker
    detection: mechanical
    scope: changed-content
    paths: ["force-app/**/objects/**/*.object-meta.xml"]
    patterns:
      - '<actionOverrides>'
    remediation: >
      Object files carrying actionOverrides belong in templates/objects/, not
      force-app/.

  - id: sfdmu-delete-old-data-introduced
    tier: B
    source: "AGENTS.md DO NOT #4 / SFDMU CRITICAL rule"
    severity: blocker
    detection: mechanical
    scope: changed-content
    paths: ["datasets/**/export.json"]
    patterns:
      - '"deleteOldData"\s*:\s*true'
    remediation: >
      deleteOldData:true is DESTRUCTIVE - it deletes every existing record before
      inserting. On the enforced SFDMU 5.6.4+ floor, Bugs 1/2/3/5 are fixed
      upstream, so "Upsert does not match" is no longer a valid reason. If this is
      intentional you need explicit user approval recorded in the PR, and then an
      allow_list entry here naming the plan and the reason.
    allow_list: []

  - id: email-template-page-flexipage
    tier: B
    source: "AGENTS.md DO NOT #6"
    severity: blocker
    detection: mechanical
    scope: changed-content
    paths: ["templates/flexipages/**/*.flexipage-meta.xml"]
    patterns:
      - '<type>EmailTemplatePage</type>'
    remediation: >
      EmailTemplatePage flexipages cannot deploy via the Metadata API. Remove it
      from templates/flexipages/.

  - id: network-real-email-committed
    tier: B
    source: "AGENTS.md DO NOT #7 / PR review focus area 8"
    severity: blocker
    detection: exact-value
    scope: exact-value
    paths: ["unpackaged/post_prm/**/networks/rlm.network-meta.xml"]
    require: '<emailSenderAddress>rlm-network-sender@example.com</emailSenderAddress>'
    remediation: >
      The repo commits the placeholder only; the patch/revert tasks substitute a
      real address at deploy time. Restore
      <emailSenderAddress>rlm-network-sender@example.com</emailSenderAddress>.

  - id: committing-to-main
    tier: B
    source: "AGENTS.md DO NOT #8"
    severity: blocker
    detection: mechanical
    scope: branch
    forbid_branches: ["main", "master"]
    remediation: >
      All changes go through a feature branch and a PR. Move these commits onto a
      branch: `git branch <feature>` then reset main back to origin/main.

  - id: robot-behavioural-change-unverified
    tier: B
    source: "AGENTS.md DO NOT #9 / robot-testing SKILL Verification"
    severity: blocker
    detection: review-prompt
    scope: changed-path
    paths: ["robot/**/*.robot", "tasks/rlm_*.py"]
    remediation: >
      A behavioural Robot change must run against a LIVE scratch org before merge -
      `robot --dryrun` resolves keywords and never opens a browser, so it is not
      verification. Comment/[Documentation]-only edits are exempt. If it cannot be
      verified before merge, say so in the PR and keep it blocked with the
      `blocked: needs-live-verification` label.

  - id: access-token-to-sf-cli
    tier: B
    source: "AGENTS.md DO NOT #5 / cci-python-tasks.mdc"
    severity: blocker
    detection: review-prompt
    scope: changed-path
    paths: ["tasks/**/*.py", "scripts/**/*.py"]
    # Without this filter the prompt fires on every touched .py, including ones
    # that never mention access_token - and a prompt that cries wolf gets --ack'd
    # reflexively, which is worse than not having it.
    content_filter: ['access_token']
    remediation: >
      Confirm no `sf` CLI invocation added here receives access_token. CLI calls
      take `self.org_config.username` as --target-org; access_token is for the REST
      API only, where it is correct. This is a review prompt, not a grep, because
      access_token appears legitimately in ~28 files for REST use and a naive
      pattern floods the gate with false positives.

  # ─────────────────────────── Tier C — .cursor/rules/*.mdc ────────────────────
  - id: analysis-artifact-in-public-repo
    tier: C
    source: ".cursor/rules/analysis-artifacts.mdc (alwaysApply)"
    severity: blocker
    detection: mechanical
    scope: added-path
    paths: ["docs/analysis/**/*.md"]
    remediation: >
      AI-generated analysis, investigation, audit, feature-gap, research and
      handoff documents go to .agents/artifacts/ - a private nested repo -
      NEVER the public rlm-base-dev repo. docs/analysis/ is reserved for curated,
      human-authored product documentation. The rule's own tie-breaker: when
      unsure which it is, treat it as a generated artifact.
      Move it: cp docs/analysis/<f>.md .agents/artifacts/<f>.md && git rm -f docs/analysis/<f>.md
      If this really is curated human-authored analysis, add an allow_list entry
      naming the file and saying who authored it.
    allow_list: []

  - id: raw-debug-in-user-facing-output
    tier: C
    source: ".cursor/rules/lwc-components.mdc - PR #317 round 9"
    severity: important
    detection: mechanical
    scope: changed-content
    paths: ["**/lwc/**/*.js"]
    ignore_comment_lines: true
    patterns:
      - 'JSON\.stringify\([^)]*\)[^;]*\b(message|title|body|toast|banner|label)\b'
      - '\b(message|title|body)\s*:\s*JSON\.stringify'
    remediation: >
      Never put JSON.stringify output, raw error objects or char codes into a
      toast, banner or any user-facing string. Use reduceErrorMessage() and show
      a sentence a user can act on.

  - id: apex-soql-in-loop
    tier: C
    source: ".cursor/rules/apex-classes.mdc / PR review focus area 3"
    severity: important
    detection: mechanical
    scope: changed-content
    paths: ["**/*.cls", "**/*.trigger"]
    exclude_paths: ["**/*Test.cls"]
    # Whole-file scan. Line-based, this rule could only ever match a for-loop
    # whose entire body AND query sat on one line — verified: it matched a
    # synthetic single-line case and MISSED the ordinary multi-line shape. It
    # would have reported "ok" forever while being incapable of finding the
    # defect it names.
    multiline: true
    patterns:
      - 'for\s*\([^)]*\)\s*\{[^{}]*\[\s*SELECT\b'
    remediation: >
      SOQL inside a loop hits governor limits under bulk load. Query once before
      the loop into a Map and look up inside it.
    allow_list:
      - file: "force-app/main/default/classes/RLM_QuoteModelUtility.cls"
        match: "for (QuoteLineItem ql : qls) { SalesTransactionItemModel item = new SalesTransactionItemModel(); List<QuoteLineItemAttribute> qlAtts = [ SELECT QuoteLineItemId, AttributeName, AttributeValue FROM QuoteLineItemAttribute WHERE QuoteLineItemId = :ql.Id ]; List<QuoteLineRelationship> qlRs = [ SELECT"
        reason: "PRE-EXISTING REAL DEFECT, deliberately NOT fixed here. One SOQL per QuoteLineItem: a quote with >100 lines breaches the SOQL governor limit. Fixing it changes Apex behaviour and needs live-org verification, which does not belong on a formatting+tooling branch. Pinned so the gate blocks NEW instances; tracked separately for a real fix."
      - file: "unpackaged/post_utils/classes/RLM_AccountUtilities.cls"
        match: "for (Integer round = 1; round <= MAX_TEARDOWN_ROUNDS; round++) { Integer progress = 0; progress += deleteQuietly( [ SELECT Id FROM UsageEntitlementEntry WHERE TransactionUsageEntitlement.Account.Id = :accountId LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM UsageBillingPeriodItem WHERE AccountId = :accountId OR AssetId IN :assetIds LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM UsageSummary WHERE AccountId = :accountId OR AssetId IN :assetIds LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM UsageRatableSummary WHERE AccountId = :accountId OR AssetId IN :assetIds LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM TransactionJournal WHERE AccountId = :accountId LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM UsageEntitlementBucket WHERE TransactionUsageEntitlement.Account.Id = :accountId LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT Id FROM TransactionUsageEntitlement WHERE AccountId = :accountId LIMIT :TEARDOWN_BATCH ] ); progress += deleteQuietly( [ SELECT"
        reason: "NOT a defect. Bounded teardown loop: iterations are capped by MAX_TEARDOWN_ROUNDS and each query carries LIMIT :TEARDOWN_BATCH, so SOQL cost is fixed per round rather than growing with org history — the comment above the loop states this intent. A batched delete of unbounded history has to re-query each round."

  - id: apex-unqualified-sharing
    tier: C
    source: ".cursor/rules/apex-classes.mdc"
    severity: important
    detection: review-prompt
    scope: changed-path
    paths: ["**/*.cls"]
    exclude_paths: ["**/*Test.cls"]
    # NEWLY ADDED classes only. Scoped to every changed .cls, a repo-wide
    # reformat put 71 files in front of this prompt, none of which touched a
    # sharing declaration. An existing class that already declares sharing is
    # not re-litigated because Prettier moved its braces.
    only_added: true
    remediation: >
      Every non-test Apex class declares `with sharing`, `without sharing` or
      `inherited sharing` explicitly. Confirm each NEW class here does. Left as a
      review prompt because the declaration can be split across lines and
      annotated, which a single-line grep gets wrong in both directions.

  # ─────────────────────────── Tier D — doc-consistency map ────────────────────
  - id: cumulusci-yml-without-regenerated-reference
    tier: D
    source: ".cursor/skills/doc-consistency/SKILL.md change-surface map"
    severity: important
    detection: mechanical
    scope: paired-change
    when_changed: ["cumulusci.yml"]
    require_changed:
      - ".cursor/skills/cci-orchestration/tasks-reference.md"
      - ".cursor/skills/cci-orchestration/flows-reference.md"
      - ".cursor/skills/cci-orchestration/feature-flags.md"
    remediation: >
      Run `python scripts/ai/generate_cci_reference.py` and commit the regenerated
      reference files. (Tier A also verifies the generator produces no diff, which
      catches the case where they were regenerated from a stale tree.)

  - id: sfdmu-plan-changed-without-readme
    tier: D
    source: ".cursor/skills/doc-consistency/SKILL.md + AGENTS.md pre-merge checklist"
    severity: important
    detection: mechanical
    scope: paired-change
    when_changed: ["datasets/sfdmu/**/export.json", "datasets/sfdmu/**/*.csv"]
    require_changed: ["datasets/sfdmu/**/README.md"]
    remediation: >
      A plan's README must track its export.json and CSVs. Update it, then run
      `python scripts/ai/check_plan_readme_consistency.py <plan_dir>` - it must
      report 0 errors. (Tier A runs that repo-wide too.)

  - id: ai-script-added-without-agents-md
    tier: D
    source: ".cursor/skills/doc-consistency/SKILL.md change-surface map, row `scripts/ai/*.py`"
    severity: important
    detection: mechanical
    scope: paired-change
    # Added because this rule's ABSENCE let its own defect through: the five-tier
    # gate itself shipped as three new scripts/ai/ files with no AGENTS.md entry,
    # and the gate stayed green. A tool that cannot catch its own omission is the
    # thing todo 080 exists to stop.
    when_changed: ["scripts/ai/*.py"]
    require_changed: ["AGENTS.md"]
    remediation: >
      A new or renamed script under scripts/ai/ must appear in AGENTS.md's
      "AI Utility Scripts" section - an undocumented agent tool is one no agent
      will run. Edit AGENTS.md only; CLAUDE.md is a symlink to it. Private
      helpers (leading underscore) still count: say what they are for.

  - id: cumulusci-yml-rename-or-flag-doc-sweep
    tier: D
    source: "AGENTS.md pre-merge checklist item 2 + change-surface map rows 1 and 4"
    severity: important
    detection: review-prompt
    scope: changed-path
    paths: ["cumulusci.yml"]
    # Covers BOTH map rows that hang off this file - task renames and feature-flag
    # changes. Kept as one prompt rather than two: a single cumulusci.yml edit
    # raising two separate prompts trains people to --ack without reading, which
    # is how a prompt stops being a control.
    #
    # Not mechanical because both need DIFF-level content analysis. A flag is a
    # `name: true|false` line among many, and every version of the file contains
    # them, so a whole-file content rule cannot tell a flag CHANGE from a flag
    # merely existing. Deliberately left as a blocking prompt rather than shipped
    # as a rule that fires on every edit.
    remediation: >
      Two sweeps on this file. (1) If a task was RENAMED or its description
      changed, grep for the OLD name and fix stale references in README.md and
      docs/ - use `git grep` over ALL tracked files, not an extension-filtered
      grep, since a prior sweep missed a .py and a .md exactly that way.
      (2) If a feature flag was added, renamed or had its default changed, update
      the README Feature Flags tables, AGENTS.md edition-flag notes, and re-run
      generate_cci_reference.py for feature-flags.md.

  - id: task-py-changed-without-doc-check
    tier: D
    source: ".cursor/skills/doc-consistency/SKILL.md map row `tasks/*.py`"
    severity: important
    detection: review-prompt
    scope: changed-path
    paths: ["tasks/*.py"]
    # The map row is scoped to "class, options, description" - NOT internals.
    # A paired-change rule here would fire on every refactor and bugfix, which is
    # most edits to this directory, so it would be --ack'd reflexively. A prompt
    # states the actual question instead of guessing at the answer.
    remediation: >
      Only if this changed a task's CLASS, OPTIONS or DESCRIPTION (not internals):
      update the matching `cumulusci.yml` description, the README Custom Tasks
      table, and any docs/ guide that documents the task. Internal refactors need
      no doc change - ack and move on.

  # ── Tier D, mechanical: registering a NEW thing ──────────────────────────────
  # These trigger on ADDED files only. The failure they catch is real and common:
  # a new artifact that no index points at is invisible, so nobody finds it and it
  # rots. Scoping to new files keeps them quiet during ordinary editing.

  - id: skill-added-without-registration
    tier: D
    source: "map row `New .cursor/skills/ file`"
    severity: important
    detection: mechanical
    scope: paired-change
    only_added: true
    when_changed: [".cursor/skills/**/*.md"]
    require_changed: ["AGENTS.md", ".cursor/skills/README.md"]
    remediation: >
      A new skill or sub-file must be registered or no agent will ever load it:
      the parent SKILL.md, the AGENTS.md Skill Index (or Skill Sub-Files table for
      a sub-file), and the .cursor/skills/README.md Skill Router. See
      .cursor/skills/skill-authoring/SKILL.md.

  - id: top-level-script-added-without-layout
    tier: D
    source: "map row `New scripts/*.py (top level)`"
    severity: important
    detection: mechanical
    scope: paired-change
    only_added: true
    # Top level ONLY - this glob's * does not cross `/`, unlike a git pathspec,
    # so scripts/ai/** and scripts/build_harness/** are correctly excluded here
    # (scripts/ai has its own rule).
    when_changed: ["scripts/*.py"]
    require_changed: ["AGENTS.md"]
    remediation: >
      Add it to the AGENTS.md Repository Layout block. The map flags this row
      specifically because top-level utilities are easy to add and never
      documented.

  - id: guide-added-without-readme-index
    tier: D
    source: "map row `New docs/guides/*.md`"
    severity: important
    detection: mechanical
    scope: paired-change
    only_added: true
    when_changed: ["docs/guides/*.md"]
    require_changed: ["README.md"]
    remediation: >
      Add the guide to the README "Primary Guides" table - an unindexed guide is
      invisible, which is the map's own wording for this row.

  - id: robot-suite-added-without-skill-update
    tier: D
    source: "map row `robot/**` (new suite, renamed keyword)"
    severity: important
    detection: mechanical
    scope: paired-change
    only_added: true
    # NEW suites only. The map row says "new suite, renamed keyword"; a rename is
    # not detectable from paths, and firing on every .robot edit would collide
    # with normal test work.
    when_changed: ["robot/**/*.robot"]
    require_changed:
      - ".cursor/skills/robot-testing/SKILL.md"
      - ".cursor/skills/robot-testing/patterns.md"
      - "README.md"
    remediation: >
      A new Robot suite needs its entry in the robot-testing SKILL.md task tables.
      Separately, and not checkable here: a behavioural suite must run against a
      LIVE scratch org before merge - `robot --dryrun` is not verification
      (AGENTS.md DO NOT #9).

  # ── Tier D, mechanical: code whose behaviour the docs describe ───────────────

  - id: ux-assembly-logic-changed-without-docs
    tier: D
    source: "map row `templates/ or UX assembly logic`"
    severity: important
    detection: mechanical
    scope: paired-change
    # Scoped to the ASSEMBLER CODE, not templates/ content. templates/ changes on
    # every UX drift writeback, so triggering on it would fire constantly for
    # changes that are data, not behaviour - and the docs describe the behaviour.
    when_changed: ["tasks/rlm_ux_assembly.py", "tasks/rlm_writeback_ux.py",
                   "tasks/rlm_retrieve_ux.py", "tasks/rlm_diff_ux.py"]
    require_changed:
      - ".cursor/skills/repo-integration/ux-assembly-retrieve.md"
      - "docs/features/dynamic-ux-assembly.md"
    remediation: >
      UX assembly/retrieve behaviour changed, so the docs describing it must keep
      up: ux-assembly-retrieve.md (assembler vs retrieve, post_ux rules, the drift
      workflow) and docs/features/dynamic-ux-assembly.md.

  - id: build-harness-changed-without-docs
    tier: D
    source: "map row `scripts/build_harness/harness/ or harness.py`"
    severity: important
    detection: mechanical
    scope: paired-change
    when_changed: ["scripts/build_harness/harness.py",
                   "scripts/build_harness/harness/**/*.py"]
    require_changed:
      - ".cursor/skills/build-harness/SKILL.md"
      - "docs/guides/build-harness.md"
    remediation: >
      Update the build-harness SKILL.md and docs/guides/build-harness.md to match
      the harness's behaviour.

  - id: harness-tui-changed-without-docs
    tier: D
    source: "map row `scripts/build_harness/tui/ or tui-cci`"
    severity: important
    detection: mechanical
    scope: paired-change
    when_changed: ["scripts/build_harness/tui/**", "tui-cci"]
    exclude_paths: ["scripts/build_harness/tui/README.md"]
    require_changed:
      - "scripts/build_harness/tui/README.md"
      - ".cursor/skills/build-harness/SKILL.md"
    remediation: >
      Update scripts/build_harness/tui/README.md and the build-harness SKILL.md.
      Note the TUI wrapper builds .harness/tui-venv on first run - if that
      contract changed, docs/guides/build-harness.md covers it too.
