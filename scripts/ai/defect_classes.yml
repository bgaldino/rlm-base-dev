  - id: apex-soql-dml-in-loop
    description: Governor-limit hazard — SOQL or DML executed inside a loop body.
    source: "AGENTS.md PR Review Focus Areas; audit-review checklist"
    severity: blocker
    detection: baseline
    paths:
      - "force-app/**/classes/*.cls"
      - "unpackaged/**/classes/*.cls"
      - "**/*.trigger"
    patterns:
      - '^\s*for\s*\([^)]*\)\s*\{[^}]*\[\s*SELECT'
      - '^\s*(?:for|while)\s*\([^)]*\)\s*\{[^}]*\b(?:insert|update|delete|upsert)\s+\w'
    allow_list: []
    remediation: Collect into a collection and perform one bulk operation outside the loop.

  - id: formula-vs-apex-case-sensitivity
    description: >
      A comparison whose case sensitivity differs between formula and Apex — formula
      "=" is case-sensitive, Apex String "==" is not.
    source: "audit-review/SKILL.md checklist"
    severity: important
    detection: review-prompt
    paths:
      - "**/*.cls"
      - "**/objects/**/*.field-meta.xml"
      - "**/flows/*.flow-meta.xml"
    patterns: []
    remediation: >
      Use equalsIgnoreCase in Apex only where the formula side is also
      case-insensitive; otherwise make both sides agree explicitly.

  - id: flow-decision-logic
    description: >
      Flow lookup/decision hazards — getFirstRecordOnly assumptions, auto-store vs
      assigned variable, inverted IsNull conditions.
    source: "audit-review/SKILL.md checklist"
    severity: important
    detection: review-prompt
    paths:
      - "**/flows/*.flow-meta.xml"
    patterns: []
    remediation: >
      Confirm each Get Records' storage mode matches how the result is consumed, and
      that IsNull decisions are not inverted.

  - id: feature-gated-metadata-in-always-on-output
    description: >
      Base layouts / flexipages / profiles referencing fields or components that only
      exist behind a feature flag — breaks builds with the flag off.
    source: "audit-review/SKILL.md checklist"
    severity: blocker
    detection: review-prompt
    paths:
      - "templates/**"
      - "unpackaged/post_ux/**"
      - "force-app/**/layouts/**"
    patterns: []
    remediation: >
      Move the reference behind the same flag, or make the component unconditional.
      See repo-integration/ux-assembly-retrieve.md.

  - id: permission-set-grant-mismatch
    description: >
      A permission set that under-grants (feature breaks for non-admins) or
      over-grants (audit finding) relative to what the Apex actually touches in
      user mode.
    source: "audit-review/SKILL.md checklist"
    severity: blocker
    detection: review-prompt
    paths:
      - "**/permissionsets/*.permissionset-meta.xml"
    patterns: []
    remediation: >
      Enumerate every object/field the user-mode code path touches and reconcile
      against the perm set in both directions. See apex-security-hardening/SKILL.md.
