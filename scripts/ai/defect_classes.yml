    source: "audit-review/SKILL.md; PR #203 (swept 5 flagged -> 20 real)"
    severity: blocker
    detection: baseline
    paths:
      - "force-app/**/classes/*.cls"
      - "unpackaged/**/classes/*.cls"
    patterns:
      - '\[\s*SELECT\b(?![^\]]*(?:WITH USER_MODE|WITH SECURITY_ENFORCED))[^\]]*\]'
    exclude_paths:
      # Test classes run in system mode by design; a test asserting on seeded data
      # is not an audit finding.
      - "**/*Test.cls"
