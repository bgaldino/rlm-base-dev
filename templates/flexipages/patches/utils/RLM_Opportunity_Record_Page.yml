feature: utils
feature_flag: quantumbit
# Adds the RLM Create Quote from Renewal Opp and RLM Consolidate Renewal Opportunities
# flow actions to the Opportunity record page highlights panel, after Delete (first
# items in the overflow menu).
patches:
  - type: insert_action
    after: "Delete"
    actions:
      # Show only on open renewal opportunities (RLM_CreateUpdateRenewalOpportunities
      # creates them with Type Existing Business). A won renewal keeps its Type, so
      # IsClosed hides the action once RLM_CloseRenewalOpportunityOnQuoteSync closes it.
      - name: "Opportunity.RLM_CreateQuoteFromRenewalOpp"
        visibility:
          - field: "Record.Type"
            operator: "EQUAL"
            value: "Existing Business"
          - field: "Record.IsClosed"
            operator: "EQUAL"
            value: "false"
      # Same rule: only an open renewal can absorb other renewals.
      - name: "Opportunity.RLM_ConsolidateRenewalOpportunities"
        visibility:
          - field: "Record.Type"
            operator: "EQUAL"
            value: "Existing Business"
          - field: "Record.IsClosed"
            operator: "EQUAL"
            value: "false"
