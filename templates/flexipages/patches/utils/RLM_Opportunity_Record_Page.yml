feature: utils
feature_flag: quantumbit
# Adds the RLM Create Quote from Renewal Opp flow action to the Opportunity record
# page highlights panel, after Delete (first item in the overflow menu).
patches:
  - type: insert_action
    after: "Delete"
    actions:
      # Show only on renewal opportunities (RLM_CreateUpdateRenewalOpportunities
      # creates them with Type Existing Business).
      - name: "Opportunity.RLM_CreateQuoteFromRenewalOpp"
        visibility:
          - field: "Record.Type"
            operator: "EQUAL"
            value: "Existing Business"
