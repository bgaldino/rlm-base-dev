feature: docgen
feature_flag: docgen
# Adds the proposal creation action. The approval action and approval-tracking
# fields live in unpackaged/post_approvals/, so they belong to the approvals
# patch (gated on quantumbit and approvals), not here: a docgen-only build
# must not reference metadata it never deployed.
patches:
  - type: insert_action
    after: "CreateRampSchedule"
    actions:
      - "Quote.RLM_Create_Proposal"
