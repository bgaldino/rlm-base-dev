feature: large_stx
feature_flag: large_stx
# Adds the "Prepare for Activation" screen action to the Order highlights panel.
# Large-deal orders bypass inline validation at activation and must be
# preprocessed first (preProcessSalesTransaction). Anchored after Edit so it
# sits just before the standard ActivateOrder action. The component self-gates:
# it no-ops for non-large-deal or already-activated orders.
patches:
  - type: insert_action
    after: "Edit"
    actions:
      # Show for Draft orders that have not completed preprocessing. The component
      # self-gates and no-ops for orders that aren't large deals.
      # There's no IsLargeDeal criterion: on 264 (ent-r1, 264.7, 2026-10-14) a visibility
      # rule or formula referencing IsLargeDeal fails to deploy ("Field IsLargeDeal does
      # not exist") without the LargeTransactionPilot perm, even with enableLargeTransaction
      # on. The field works in SOQL, in Apex and as a record field. Restore the criterion
      # once that deploys.
      # RLM_Preprocessing_Complete__c is a formula (LEFT(PreprocessingStatus,1)="C"),
      # which is billing-agnostic: complete is "CNNN" (billing off) or "CCCC" (on).
      - name: "Order.RLM_Prepare_For_Activation"
        visibility:
          - field: "Record.Status"
            operator: "EQUAL"
            value: "Draft"
          - field: "Record.RLM_Preprocessing_Complete__c"
            operator: "EQUAL"
            value: "false"
  # Surface the large-deal flag and the preprocessing fields in the System
  # Information section, so users can see whether an order is a large deal and watch
  # the bitmask and derived flag while preparing and activating it. IsLargeDeal and
  # PreprocessingStatus are standard, but PreprocessingStatus only exists (and
  # IsLargeDeal is only editable) with enableLargeTransaction on. RLM_Preprocessing_
  # Complete__c is large_stx-only. So these live in the patch (not base) to keep
  # large_stx=false builds valid. A record field on IsLargeDeal deploys; only
  # visibility rules and formulas on it fail (see above).
  - type: add_facet_field
    after: "OrchestrationSbmsStatus"
    fields:
      - "IsLargeDeal"
      - "PreprocessingStatus"
  - type: add_facet_field
    after: "ValidationResult"
    fields:
      - "RLM_Preprocessing_Complete__c"
